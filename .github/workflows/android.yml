name: Android family test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-native/**', 'index.html', 'community.js', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager=$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          dirname "$manager" >> "$GITHUB_PATH"
          "$manager" --version
          set +o pipefail
          yes | "$manager" --licenses >/dev/null
          set -o pipefail
          if [ ! -f "$sdk/platforms/android-35/android.jar" ]; then "$manager" 'platforms;android-35'; fi
          if [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then "$manager" 'build-tools;35.0.0'; fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
      - name: Ensure audio conversion tool
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -n 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare local web and licensed audio assets
        run: |
          set -euo pipefail
          a=android-native/app/src/main/assets
          mkdir -p "$a"
          cp index.html community.js icon.svg mosque.svg icon-192.png icon-512.png manifest.webmanifest sw.js "$a/"
          curl --fail --location --retry 3 --user-agent 'Waqt/0.1 (github.com/azrxc/Q)' 'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' -o /tmp/adhan.ogg
          curl --fail --location --retry 3 --user-agent 'Waqt/0.1 (github.com/azrxc/Q)' 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Eid_al-Fitr_Fajr_azan_at_Malm%C3%B6_Mosque_-_19_August_2012.webm' -o /tmp/fajr.webm
          ffmpeg -v error -i /tmp/adhan.ogg -vn -ac 1 -b:a 96k "$a/azan.mp3"
          ffmpeg -v error -i /tmp/fajr.webm -vn -ac 1 -b:a 96k "$a/fajr.mp3"
          test -s "$a/azan.mp3" && test -s "$a/fajr.mp3"
          curl --fail --location --retry 3 --user-agent 'Waqt/0.3 (github.com/azrxc/Q)' 'https://upload.wikimedia.org/wikipedia/commons/7/7c/33937_ejaz215_call-to-prayer-from-the-prophet-s-mo.ogg' -o /tmp/voice-medina
          ffmpeg -v error -i /tmp/voice-medina -vn -ac 1 -b:a 96k "$a/azan-medina.mp3"
          test -s "$a/azan-medina.mp3"
          curl --fail --location --retry 3 --user-agent 'Waqt/0.3 (github.com/azrxc/Q)' 'https://upload.wikimedia.org/wikipedia/commons/8/86/Azan.ogg' -o /tmp/voice-alternative
          ffmpeg -v error -i /tmp/voice-alternative -vn -ac 1 -b:a 96k "$a/azan-alternative.mp3"
          test -s "$a/azan-alternative.mp3"
          curl --fail --location --retry 3 --user-agent 'Waqt/0.3 (github.com/azrxc/Q)' 'https://upload.wikimedia.org/wikipedia/commons/6/6d/Maghrib_Adhan_at_the_Masjid_al_Haram%2C_Mecca_-_25_Feb%2C_2012.webm' -o /tmp/voice-makkah
          ffmpeg -v error -ss 113 -i /tmp/voice-makkah -t 183 -vn -ac 1 -b:a 96k "$a/azan-makkah.mp3"
          test -s "$a/azan-makkah.mp3"
      - name: Validate web JavaScript syntax
        run: |
          python3 -c 'import re,pathlib; s=pathlib.Path("index.html").read_text(); pathlib.Path("/tmp/waqt-inline.js").write_text("\n".join(re.findall(r"<script>(.*?)</script>",s,re.S)))'
          node --check /tmp/waqt-inline.js
          node --check community.js
      - name: Compile Android debug APK
        run: gradle -p android-native assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Waqt-Android-family-test
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
